# Merge these entries into the project's existing exclude_patterns list.
# Keep CocoIndex Code defaults and all user-authored settings.
exclude_patterns:
  # Unity root-generated state and build output
  - "Library/**"
  - "Temp/**"
  - "Obj/**"
  - "Logs/**"
  - "Build/**"
  - "Builds/**"
  - "UserSettings/**"
  - "MemoryCaptures/**"
  - "Recordings/**"
  - "ServerData/**"
  - "ExportedObj/**"

  # Unity-generated content inside Assets
  - "Assets/Addressables_Temp*"
  - "Assets/StreamingAssets/aa*"
  - "Assets/Unity.VisualScripting.Generated/**"
  - "Assets/Plugins/Editor/JetBrains*"
  - "Assets/SceneDependencyCache*"

  # Registered third-party source. Keep project-owned Assets/Plugins code eligible.
  - "Assets/Plugins/Demigiant/**"
  - "Assets/Plugins/Sirenix/**"
  - "Assets/Plugins/RootMotion/**"
  - "Assets/Plugins/Feel/**"
  - "Assets/Plugins/FImpossible Creations/**"
  - "Assets/Plugins/KINEMATION/**"
  - "Assets/Plugins/Technie/**"
  - "Assets/Plugins/Roslyn/**"

  # Serialized Unity assets and generated IDE/project files
  - "**/*.meta"
  - "**/*.unity"
  - "**/*.prefab"
  - "**/*.asset"
  - "**/*.mat"
  - "**/*.anim"
  - "**/*.controller"
  - "**/*.playable"
  - "**/*.csproj"
  - "**/*.unityproj"
  - "**/*.sln"
  - "**/*.slnx"
  - "**/*.DotSettings.user"
